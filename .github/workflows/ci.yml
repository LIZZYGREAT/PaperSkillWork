name: CI

on: [push]

permissions:
  contents: read

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check pushed changes for whitespace errors
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r "$SHA"
          else
            git diff --check "$BEFORE" "$SHA"
          fi

      - name: Run PaperSkillWork tests
        run: python -m pytest -q

      - name: Check PhyAgentOS workspace
        run: python tools/paper.py check phyagentos

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: papers/phyagentos/web/enhanced/package-lock.json

      - name: Install Enhanced dependencies
        working-directory: papers/phyagentos/web/enhanced
        run: npm ci

      - name: Build Enhanced project
        working-directory: papers/phyagentos/web/enhanced
        run: npm run build

      - name: Audit Enhanced project
        working-directory: papers/phyagentos/web/enhanced
        run: npm run audit:enhanced
