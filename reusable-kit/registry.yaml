# Reusable Kit component registry (v2).
#
# `tier`  = copying scope: P0 ships with the continual-learning preset, P1 is opt-in.
# `status` = maturity: candidate | approved | deprecated. Tier never implies approval.
#
# A component may only be marked `approved` when the following are all recorded:
#   approved_by: the human reviewer who accepted it
#   approved_at: ISO date (YYYY-MM-DD) of that acceptance
#   evidence:    at least one path to the reviewed evidence (screenshots, browser
#                states, or the paper/demo route that was actually inspected)
# `deprecated` entries stay listed so old plans resolve, but they may not be scaffolded.
#
# Every entry is `candidate` until a human acceptance record exists. Do not promote a
# component to honour an implementation plan, a build result, or an automated check.
