implementation:
  I01:
    text: "A generic training implementation can represent θ* as detached parameter-aligned tensors and F as non-trainable parameter-aligned importance buffers."
    type: IMPLEMENTATION_MAPPING
    source: null
    boundary: "Conceptual implementation mapping; not a code listing or variable naming claim from the paper."
  I02:
    text: "A new-task training step computes the current task loss and penalty from current parameters plus saved anchors/importance, backpropagates their sum, then lets an optimizer update current trainable parameters."
    type: IMPLEMENTATION_MAPPING
    source: null
    boundary: "Generic autograd implementation flow; optimizer details vary."
  I03:
    text: "The browser's numeric parameter and gradient calculator is a small deterministic Teaching Toy, not a neural-network training run."
    type: IMPLEMENTATION_MAPPING
    source: null
    boundary: "No paper performance values are generated by the tutorial simulation."

background:
  B01:
    text: "In gradient-based optimization, adding a differentiable penalty to the loss adds its derivative to the total gradient."
    type: GENERAL_BACKGROUND
    source: null
  B02:
    text: "A diagonal approximation stores one curvature/precision-like value per parameter and omits off-diagonal parameter couplings."
    type: GENERAL_BACKGROUND
    source: null
  B03:
    text: "LwF is commonly described as output/function-space regularization, while EWC constrains parameter-space movement using importance weights."
    type: GENERAL_BACKGROUND
    source: null
    boundary: "Cross-paper contrast for orientation; LwF is not a comparison experiment in this EWC paper."

