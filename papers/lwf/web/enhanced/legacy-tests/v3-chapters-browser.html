<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LwF 04–07 浏览器验收</title>
    <style>
      :root { color: #243b4b; background: #f4f7f5; font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 22px; }
      main { width: min(1180px, 100%); margin: auto; }
      h1 { margin: 0 0 5px; font-size: 1.55rem; }
      main > p { margin: 0 0 14px; color: #657887; }
      #summary { margin: 12px 0; padding: 12px 14px; border: 1px solid #d8e1e2; border-radius: 9px; background: white; }
      #summary[data-result="passed"] { border-color: #9ac8b9; background: #edf7f2; }
      #summary[data-result="failed"] { border-color: #d8a89e; background: #fff2ef; }
      #results { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px 10px; margin: 0 0 16px; padding: 0; list-style: none; }
      #results li { min-height: 35px; padding: 7px 10px; border-radius: 7px; background: white; font-size: .83rem; }
      #results .pass { border-left: 3px solid #218067; }
      #results .fail { border-left: 3px solid #b44b3e; color: #8b342b; }
      iframe { display: block; width: 100%; height: min(850px,78vh); border: 1px solid #cbd7dc; border-radius: 10px; background: white; }
      @media (max-width: 720px) { body { padding: 12px; } #results { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>LwF 04–07 浏览器验收</h1>
      <p>检查新增章节的导航、交互状态、Reference Hub 与移动布局。此页只面向本地开发预览，不生成截图文件。</p>
      <div id="summary" role="status" aria-live="polite">正在加载 LwF 新章节…</div>
      <ol id="results" aria-label="章节检查结果"></ol>
      <iframe title="LwF 章节预览" src="/?version=v3"></iframe>
    </main>
    <script>
      const frame = document.querySelector("iframe");
      const resultList = document.querySelector("#results");
      const summary = document.querySelector("#summary");
      const pause = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      const waitFor = async (predicate, timeout = 6000) => {
        const start = Date.now();
        while (Date.now() - start < timeout) { if (predicate()) return; await pause(40); }
        throw new Error("页面未在预期时间内完成更新");
      };

      async function runChecks(doc) {
        const checks = [];
        const check = async (name, action) => {
          try { await action(); checks.push({ name, passed: true }); }
          catch (error) { checks.push({ name, passed: false, message: error instanceof Error ? error.message : String(error) }); }
        };
        await waitFor(() => doc.querySelector(".lwf-v3") && doc.querySelector("#chapter-04"));

        await check("04 · 主导航显示已完成章节", () => {
          const chapters = [...doc.querySelectorAll(".v3-rail-nav button")];
          assert(chapters.length === 8, "StageRail 应保留 00–07 八个章节");
          assert(!chapters[4].disabled && chapters[4].textContent.includes("机制与边界"), "04 应可从 StageRail 进入");
          assert(doc.querySelector("#chapter-04"), "04 章节内容缺失");
        });

        await check("03 → 04 · 章节翻页已接通", async () => {
          const next = doc.querySelector("#chapter-03 .v3-chapter-navigation .is-next");
          assert(next && !next.disabled, "03 的下一章入口应进入 04");
          next.click();
          await waitFor(() => doc.defaultView.location.hash === "#chapter-04");
          assert(doc.querySelector("#chapter-04 h2")?.textContent.includes("保持旧响应"), "04 未成为当前目标");
        });

        await check("04 · 参数保持与响应保持切换", async () => {
          const compare = doc.querySelector("#chapter-04 .v3-preservation-compare");
          const parameter = [...compare.querySelectorAll("button")].find((button) => button.textContent.includes("Parameter"));
          const response = [...compare.querySelectorAll("button")].find((button) => button.textContent.includes("Response"));
          assert(parameter && response, "保持对象切换按钮缺失");
          parameter.click();
          await waitFor(() => parameter.getAttribute("aria-pressed") === "true" && compare.textContent.includes("参数坐标相对"));
          assert(compare.querySelector(".v3-parameter-comparison"), "参数视角图示没有显示");
          response.click();
          await waitFor(() => response.getAttribute("aria-pressed") === "true" && compare.querySelector(".v3-response-comparison"));
          assert(compare.textContent.includes("Teacher") && compare.textContent.includes("Student"), "响应视角应比较 Teacher 与 Student");
        });

        await check("04 · λₒ 与 Temperature 控件更新说明", async () => {
          const objective = doc.querySelector("#chapter-04 .v3-objective-balance");
          const high = [...objective.querySelectorAll(".v3-objective-controls button")].find((button) => button.textContent.includes("high"));
          assert(high, "λₒ high 控件缺失");
          high.click();
          await waitFor(() => objective.classList.contains("emphasis-old") && objective.textContent.includes("更强调旧响应保持"));
          const details = objective.querySelector(".v3-temperature-support");
          details.querySelector("summary").click();
          await waitFor(() => details.open);
          const t1 = [...details.querySelectorAll(".v3-compact-toggle button")].find((button) => button.textContent.includes("T = 1"));
          const t2 = [...details.querySelectorAll(".v3-compact-toggle button")].find((button) => button.textContent.includes("T = 2"));
          t1.click();
          await waitFor(() => details.textContent.includes("分布较尖锐"));
          t2.click();
          await waitFor(() => details.textContent.includes("论文采用 T = 2"));
        });

        await check("04 · Broad / Partial / Small 覆盖状态", async () => {
          const coverage = doc.querySelector("#chapter-04 .v3-coverage-boundary");
          const fixedPoints = coverage.querySelector(".v3-coverage-points").innerHTML;
          for (const [label, className] of [["Broad overlap", "broad"], ["Partial overlap", "partial"], ["Small overlap", "small"]]) {
            const button = [...coverage.querySelectorAll(".v3-coverage-controls button")].find((item) => item.textContent === label);
            assert(button, `缺少 ${label} 覆盖状态`);
            button.click();
            await waitFor(() => coverage.querySelector(`.v3-current-coverage.coverage-${className}`));
            assert(coverage.querySelector(".v3-coverage-points").innerHTML === fixedPoints, "切换时旧任务相关输入示意应保持不变");
          }
          assert(coverage.textContent.includes("没有被当前训练目标直接观察"), "边界说明应指出当前输入没有直接观察全部旧域行为");
          assert(coverage.textContent.includes("不是数据集的实测分布或遗忘数值"), "图示应说明这不是实测分布或遗忘数值");
        });

        await check("04 · 从机制内容打开 Reference Hub", async () => {
          const domainReference = [...doc.querySelectorAll("#chapter-04 .v3-mechanism-reference-links button")].find((button) => button.textContent.includes("domain coverage"));
          assert(domainReference, "缺少域覆盖 Reference Hub 入口");
          domainReference.click();
          await waitFor(() => doc.querySelector(".v2-reference-drawer"));
          await waitFor(() => doc.querySelector(".v2-hub-id")?.textContent.trim() === "claim:domain_mismatch");
          assert(doc.querySelector(".v2-hub-detail")?.textContent.includes("任务不匹配可能削弱响应覆盖"), "Reference Hub 没有选中域差异证据条目");
          doc.querySelector(".v2-reference-drawer").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await waitFor(() => !doc.querySelector(".v2-reference-drawer"));
        });

        await check("04 → 05 · 连续任务章节已接通", async () => {
          const next = doc.querySelector("#chapter-04 .v3-chapter-navigation .is-next");
          assert(next && !next.disabled, "04 的下一章入口应进入 05");
          next.click();
          await waitFor(() => doc.defaultView.location.hash === "#chapter-05");
          assert(doc.querySelector("#chapter-05 h2")?.textContent.includes("下一项怎样接上"), "05 未成为当前目标");
        });

        await check("05 · 明确区分训练步与任务序列", () => {
          const chapter = doc.querySelector("#chapter-05");
          assert(chapter.textContent.includes("TRAINING-STEP LEVEL") && chapter.textContent.includes("Chapter 03"), "05 应回链到 03 的训练步层级");
          assert(chapter.textContent.includes("TASK-SEQUENCE LEVEL") && chapter.textContent.includes("Chapter 05"), "05 应明确任务序列层级");
          assert(chapter.textContent.includes("minibatch") && chapter.textContent.includes("任务阶段"), "应指出 03 的循环位于任务阶段内部");
        });

        await check("05 · 状态机顺序与下一任务 loop-back", async () => {
          const machine = doc.querySelector("#chapter-05 .rk-state-machine");
          const advance = async (id) => {
            const state = machine.querySelector(`#rk-state-${id}`);
            assert(state, `缺少状态 ${id}`);
            state.click();
            await waitFor(() => state.getAttribute("aria-current") === "step");
          };
          await advance("freeze-teacher");
          const skipped = machine.querySelector("#rk-state-refresh-responses");
          skipped.click();
          await waitFor(() => machine.querySelector("#rk-state-refresh-responses").getAttribute("aria-current") !== "step");
          assert(machine.querySelector("#rk-state-freeze-teacher").getAttribute("aria-current") === "step", "guided state machine should not skip stages");
          for (const id of ["task-arrives", "refresh-responses", "add-head", "adapt-student", "promote-model", "next-task", "freeze-teacher"]) await advance(id);
          assert(machine.querySelector('[data-from="next-task"][data-to="freeze-teacher"]'), "最后一步应回到下一阶段 Teacher");
        });

        await check("05 · B/C 阶段响应目标重新生成", () => {
          const refresh = doc.querySelector("#chapter-05 .v3-refresh-pair");
          assert(refresh.textContent.includes("X_B") && refresh.textContent.includes("Teacher_A") && refresh.textContent.includes("Y_A on X_B"), "Task B 的示意不完整");
          assert(refresh.textContent.includes("X_C") && refresh.textContent.includes("Teacher_AB") && refresh.textContent.includes("Y_A, Y_B on X_C"), "Task C 的示意不完整");
          assert(doc.querySelector("#chapter-05 .v3-sequence-drift")?.textContent.includes("Model_ABC"), "需要说明模型可能跨任务阶段累积变化");
          assert(doc.querySelector("#chapter-05").textContent.includes("不是永久 cache"), "需要明确回应不是永久缓存");
        });

        await check("05 · Figure 4 原文预览与 Chapter 06 入口", () => {
          const preview = doc.querySelector("#chapter-05 .v3-figure4-preview iframe");
          assert(preview?.src.includes("arxiv.org/pdf/1606.09282v3#page=8"), "预览应指向原论文 PDF 第 8 页");
          const openSource = doc.querySelector("#chapter-05 .v3-figure4-preview figcaption a");
          assert(openSource?.href.includes("arxiv.org/pdf/1606.09282v3#page=8"), "内嵌预览应提供原文回退链接");
          const fullEvidence = [...doc.querySelectorAll("#chapter-05 .v3-figure4-actions button")].find((button) => button.textContent.includes("Chapter 06"));
          assert(fullEvidence, "缺少 Chapter 06 完整证据入口");
          assert(fullEvidence.disabled === !doc.querySelector("#chapter-06"), "06 尚未就绪时入口应禁用；就绪后应自动开放");
        });

        await check("05 · Reference Hub 收录阶段响应刷新", async () => {
          const button = [...doc.querySelectorAll("#chapter-05 .v3-sequential-reference-links button")].find((item) => item.textContent.includes("response refresh"));
          assert(button, "缺少 response refresh Reference Hub 入口");
          button.click();
          await waitFor(() => doc.querySelector(".v2-reference-drawer"));
          await waitFor(() => doc.querySelector(".v2-hub-id")?.textContent.trim() === "confusion:sequential_refresh");
          assert(doc.querySelector(".v2-hub-detail")?.textContent.includes("永久 cache"), "Reference Hub 未显示阶段刷新解释");
          doc.querySelector(".v2-reference-drawer").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await waitFor(() => !doc.querySelector(".v2-reference-drawer"));
        });

        await check("05 → 06 · 证据章节与协议优先顺序", async () => {
          const next = doc.querySelector("#chapter-05 .v3-chapter-navigation .is-next");
          assert(next && !next.disabled, "05 的下一章入口应进入 06");
          next.click();
          await waitFor(() => doc.defaultView.location.hash === "#chapter-06");
          const protocol = doc.querySelector("#chapter-06 .v3-protocol-block");
          const explorer = doc.querySelector("#chapter-06 .v3-evidence-main-block");
          assert(protocol && explorer && protocol.compareDocumentPosition(explorer) & Node.DOCUMENT_POSITION_FOLLOWING, "全局协议应显示在结果浏览器之前");
          assert(doc.querySelector("#chapter-06 h2")?.textContent.includes("真正支持了什么"), "06 章节内容缺失");
        });

        await check("06 · Table 1 保留原表差值格式，Table 2 按研究问题阅读", async () => {
          const chapter = doc.querySelector("#chapter-06");
          const table1 = chapter.querySelector('.v3-evidence-table[aria-label]') ?? chapter.querySelector(".v3-evidence-table");
          assert(table1?.textContent.includes("54.7%") && table1.textContent.includes("57.7%"), "Table 1 应显示 LwF 原表绝对值");
          assert(table1.textContent.includes("−3.8 pp") && table1.textContent.includes("−0.7 pp"), "比较方法应保留原表相对 LwF 的差值");
          assert(table1.textContent.includes("图像与标签") && table1.textContent.includes("Joint Training"), "应标明 Joint Training 使用旧数据");
          assert(chapter.textContent.includes("这里不重建绝对值"), "差值格式需要说明没有重建绝对值");
          assert(!/winner|leaderboard|best method|rank/i.test(chapter.querySelector(".v3-evidence-main-block").textContent), "证据浏览器不应采用排行榜用语");
          const selectors = [...chapter.querySelectorAll(".v3-evidence-selector [role=tab]")];
          selectors[1].click();
          await waitFor(() => chapter.querySelector(".v3-evidence-detail").getAttribute("data-evidence-id") === "table_2");
          const warmup = [...chapter.querySelectorAll(".v3-table2-questions button")].find((button) => button.textContent.includes("warm-up"));
          warmup.click();
          await waitFor(() => chapter.querySelector(".v3-table2-answer").textContent.includes("并非关键"));
          assert(chapter.querySelector(".v3-table2-answer").textContent.includes("Boundary"), "Table 2 每个问题需显示结论边界");
        });

        await check("06 · Figure 4 / Figure 7 原文与协议证据", async () => {
          const chapter = doc.querySelector("#chapter-06");
          const selectors = [...chapter.querySelectorAll(".v3-evidence-selector [role=tab]")];
          selectors[2].click();
          await waitFor(() => chapter.querySelector(".v3-evidence-detail").getAttribute("data-evidence-id") === "figure_4");
          assert(chapter.querySelector(".v3-evidence-paper-preview iframe")?.src.includes("arxiv.org/pdf/1606.09282v3#page=8"), "Figure 4 应显示原论文第 8 页");
          assert(chapter.querySelector(".v3-figure-reading-guide")?.textContent.includes("±2 个标准差"), "Figure 4 应说明误差线和重复次数");
          selectors[3].click();
          await waitFor(() => chapter.querySelector(".v3-evidence-detail").getAttribute("data-evidence-id") === "figure_7");
          assert(chapter.querySelector(".v3-evidence-paper-preview iframe")?.src.includes("arxiv.org/pdf/1606.09282v3#page=10"), "Figure 7 应显示原论文第 10 页");
          assert(chapter.querySelector(".v3-figure-reading-guide")?.textContent.includes("parameter-L2"), "Figure 7 应交代参数 L2 对照");
        });

        await check("06 · Supported / Too Strong / Unsupported 判断反馈", async () => {
          const chapter = doc.querySelector("#chapter-06");
          const claims = [...chapter.querySelectorAll(".v3-verdict-claim-list button")];
          const choose = async (index, verdict) => {
            claims[index].click();
            await waitFor(() => chapter.querySelector(".v3-verdict-card").getAttribute("data-claim-id") === ["claim:eliminates_forgetting", "claim:no_old_training_data", "claim:response_beats_parameter", "claim:foundation_models_scope"][index]);
            const button = [...chapter.querySelectorAll(".v3-verdict-options button")].find((item) => item.textContent === verdict);
            button.click();
            await waitFor(() => chapter.querySelector(".v3-verdict-feedback")?.textContent.includes("判断符合证据"));
            return chapter.querySelector(".v3-verdict-feedback");
          };
          assert((await choose(0, "Too Strong"))?.textContent.includes("判断符合证据"), "消除遗忘主张应判断为 Too Strong");
          assert((await choose(1, "Supported"))?.textContent.includes("判断符合证据"), "无需旧任务训练数据应判断为 Supported");
          assert((await choose(2, "Supported"))?.textContent.includes("判断符合证据"), "响应正则与参数 L2 的受限比较应判断为 Supported");
          assert((await choose(3, "Unsupported"))?.textContent.includes("判断符合证据"), "基础模型主张应判断为 Unsupported");
        });

        await check("06 · Evidence Explorer 可深链 Reference Hub", async () => {
          const chapter = doc.querySelector("#chapter-06");
          const selectors = [...chapter.querySelectorAll(".v3-evidence-selector [role=tab]")];
          selectors[0].click();
          await waitFor(() => chapter.querySelector(".v3-evidence-detail").getAttribute("data-evidence-id") === "table_1");
          chapter.querySelector(".v3-evidence-reference-link").click();
          await waitFor(() => doc.querySelector(".v2-reference-drawer"));
          await waitFor(() => doc.querySelector(".v2-hub-id")?.textContent.trim() === "evidence:table_1");
          doc.querySelector(".v2-reference-drawer").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await waitFor(() => !doc.querySelector(".v2-reference-drawer"));
        });

        await check("06 → 07 · 八章导航全部就绪", async () => {
          const next = doc.querySelector("#chapter-06 .v3-chapter-navigation .is-next");
          assert(next && !next.disabled, "06 的下一章入口应进入 07");
          next.click();
          await waitFor(() => doc.defaultView.location.hash === "#chapter-07");
          const rail = [...doc.querySelectorAll(".v3-rail-nav button")];
          assert(rail.length === 8 && !rail[7].disabled && rail[7].textContent.includes("完整回放"), "07 应在 StageRail 标记为已就绪");
          assert(/8\s*\/\s*8/.test(doc.querySelector(".v3-rail-progress")?.textContent ?? ""), "八个章节均应就绪");
        });

        await check("07 · 重用同一系统图完成 9 步生命周期回放", async () => {
          const chapter = doc.querySelector("#chapter-07");
          const replay = chapter.querySelector(".v3-full-replay");
          const systemGraph = replay.querySelector(".v3-process-visual");
          assert(replay.getAttribute("data-replay-step") === "old-model", "回放应默认从旧模型手动开始");
          assert(systemGraph.classList.contains("is-full-replay") && systemGraph.querySelector(".v3-process-svg"), "07 应重用 Chapter 02–03 的同一张系统图");
          assert(systemGraph.querySelector(".v3-process-visual-header").textContent.includes("STEP 01 / 09"), "主图应显示高层回放进度而不是十个训练小步");
          const expected = ["old-model", "new-task", "freeze-teacher", "generate-responses", "expand-student", "warmup", "joint-training", "updated-student", "next-teacher"];
          const next = replay.querySelector('.v3-replay-step-controls button[aria-label="下一步"]');
          for (const id of expected) {
            await waitFor(() => replay.getAttribute("data-replay-step") === id);
            if (id === "joint-training") {
              assert(replay.querySelector(".v3-replay-joint-detail")?.textContent.includes("Forward") && replay.querySelector(".v3-replay-joint-detail").textContent.includes("Backward"), "联合优化应内嵌 Forward → losses → Backward → Update");
            }
            if (id === "next-teacher") assert(replay.querySelector(".v3-replay-loopback")?.textContent.includes("Teacherₜ₊₁") && replay.querySelector(".v3-replay-loopback").textContent.includes("Task t+2"), "最后一步应把新模型闭环到下一任务");
            if (id !== expected[expected.length - 1]) {
              next.click();
              await waitFor(() => replay.getAttribute("data-replay-step") !== id);
            }
          }
          assert(chapter.querySelector(".v3-replay-takeaways ol").querySelectorAll("li").length === 6, "回放结束后应收束为六条核心结论");
        });

        await check("07 · Previous / Next / Play / Pause / Speed 控件", async () => {
          const replay = doc.querySelector("#chapter-07 .v3-full-replay");
          const previous = replay.querySelector('.v3-replay-step-controls button[aria-label="上一步"]');
          const next = replay.querySelector('.v3-replay-step-controls button[aria-label="下一步"]');
          previous.click();
          await waitFor(() => replay.getAttribute("data-replay-step") === "updated-student");
          const fast = [...replay.querySelectorAll(".v3-replay-speed button")].find((button) => button.textContent === "1.5×");
          fast.click();
          await waitFor(() => fast.getAttribute("aria-pressed") === "true");
          const play = replay.querySelector('.v3-replay-step-controls button[aria-label="播放回放"]');
          play.click();
          await waitFor(() => replay.querySelector(".v3-replay-step-controls button[aria-label=\"暂停回放\"]"), 3000);
          await waitFor(() => replay.getAttribute("data-replay-step") === "next-teacher", 4000);
          replay.querySelector('.v3-replay-step-controls button[aria-label="暂停回放"]').click();
          await waitFor(() => replay.querySelector(".v3-replay-live").textContent.includes("Manual"));
          next.click();
          await waitFor(() => replay.getAttribute("data-replay-step") === "old-model");
        });

        await check("07 · Reference Hub 旧响应目标深链", async () => {
          const reference = doc.querySelector("#chapter-07 .v3-replay-reference");
          reference.click();
          await waitFor(() => doc.querySelector(".v2-reference-drawer"));
          await waitFor(() => doc.querySelector(".v2-hub-id")?.textContent.trim() === "formula:l_old");
          doc.querySelector(".v2-reference-drawer").dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await waitFor(() => !doc.querySelector(".v2-reference-drawer"));
        });

        await check("05–07 · 390px 移动视口无页面横向溢出", async () => {
          const originalWidth = frame.style.width;
          try {
            frame.style.width = "390px";
            await waitFor(() => doc.defaultView.innerWidth <= 400);
            const root = doc.documentElement;
            assert(root.scrollWidth <= root.clientWidth + 1, `章节主页面横向溢出：${root.scrollWidth}px > ${root.clientWidth}px`);
            const diagram = doc.querySelector("#chapter-05 .rk-state-machine__viewport");
            assert(diagram.scrollWidth > diagram.clientWidth, "窄视口下，流程图应在自己的可滚动区域内查看");
            const evidence = doc.querySelector("#chapter-06 .v3-evidence-detail");
            assert(evidence.getBoundingClientRect().width <= root.clientWidth + 1, "06 的证据面板不应超出窄视口");
            assert(evidence.querySelector(".v3-table-scroll").scrollWidth > evidence.querySelector(".v3-table-scroll").clientWidth, "Table 1 应在自身容器中横向查看");
            const replayGraph = doc.querySelector("#chapter-07 .v3-replay-system-visual .v3-process-visual");
            assert(replayGraph.getBoundingClientRect().width <= root.clientWidth + 1, "07 的系统图不应超出窄视口");
            assert(doc.defaultView.getComputedStyle(replayGraph.querySelector(".v3-process-mobile")).display !== "none", "窄屏回放应显示手机端系统图");
          } finally {
            frame.style.width = originalWidth;
          }
        });

        const figureFrame = doc.querySelector("#chapter-05 .v3-figure4-preview iframe");
        if (figureFrame) {
          figureFrame.loading = "eager";
          figureFrame.scrollIntoView({ behavior: "auto", block: "center" });
          await Promise.race([new Promise((resolve) => figureFrame.addEventListener("load", resolve, { once: true })), pause(6000)]);
        }
        const evidenceFigure = doc.querySelector("#chapter-06 .v3-evidence-paper-preview iframe");
        if (evidenceFigure) {
          evidenceFigure.loading = "eager";
          evidenceFigure.scrollIntoView({ behavior: "auto", block: "center" });
          await Promise.race([new Promise((resolve) => evidenceFigure.addEventListener("load", resolve, { once: true })), pause(6000)]);
        }

        const failures = checks.filter((item) => !item.passed);
        for (const item of checks) {
          const row = document.createElement("li");
          row.className = item.passed ? "pass" : "fail";
          row.textContent = `${item.passed ? "通过" : "失败"} · ${item.name}${item.message ? `：${item.message}` : ""}`;
          resultList.append(row);
        }
        summary.textContent = failures.length ? `浏览器验收完成：${checks.length - failures.length} 项通过，${failures.length} 项失败。` : `浏览器验收通过：${checks.length} 项检查全部通过。`;
        summary.dataset.result = failures.length ? "failed" : "passed";
        window.__chapterAuditResult = { passed: checks.length - failures.length, failed: failures.length, checks };
      }

      frame.addEventListener("load", () => {
        void runChecks(frame.contentDocument).catch((error) => {
          summary.textContent = `浏览器验收失败：${error instanceof Error ? error.message : String(error)}`;
          summary.dataset.result = "failed";
          window.__chapterAuditResult = { failed: 1, message: summary.textContent };
        });
      }, { once: true });
    </script>
  </body>
</html>
